services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nimbusforge}
      POSTGRES_USER: ${POSTGRES_USER:-nimbusforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nimbusforge_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-nimbusforge_test}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/01-create-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
